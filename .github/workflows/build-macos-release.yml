name: Build macOS installer

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Committed branch, tag, or SHA to package
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: notchy-installer-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: Universal macOS 14+ installer
    runs-on: macos-15
    timeout-minutes: 20
    env:
      UPDATE_REPOSITORY: ${{ github.repository }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the matching Xcode toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          # Conversion dependencies use Apple silicon; the app is still universal.
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          xcrun --show-sdk-path
          git diff --exit-code

      - name: Set up the pinned model-conversion interpreter
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: script/face-model/requirements-auraface.txt

      - name: Generate and verify the pinned recognition model
        run: |
          python -m venv "$RUNNER_TEMP/notchy-model-venv"
          MODEL_PYTHON="$RUNNER_TEMP/notchy-model-venv/bin/python"
          "$MODEL_PYTHON" -m pip install -r script/face-model/requirements-auraface.txt
          "$MODEL_PYTHON" -I script/face-model/convert_auraface.py \
            --onnx "$RUNNER_TEMP/glintr100.onnx" --download \
            --out Sources/Notchy/Features/FaceCheck/Model/AuraFace.mlpackage \
            --precision fp32 --report "$RUNNER_TEMP/auraface-conversion.json"
          "$MODEL_PYTHON" -I script/face-model/parity_auraface.py \
            --onnx "$RUNNER_TEMP/glintr100.onnx" \
            --package Sources/Notchy/Features/FaceCheck/Model/AuraFace.mlpackage \
            --compute-units cpu --report "$RUNNER_TEMP/auraface-parity.json"

      - name: Build the installer without interactive Finder automation
        run: |
          mkdir -p "$RUNNER_TEMP/notchy-ci-bin"
          cat > "$RUNNER_TEMP/notchy-ci-bin/osascript" <<'SCRIPT'
          #!/bin/sh
          echo 'Finder window layout is optional and skipped in headless CI.' >&2
          exit 1
          SCRIPT
          chmod +x "$RUNNER_TEMP/notchy-ci-bin/osascript"
          PATH="$RUNNER_TEMP/notchy-ci-bin:$PATH" ./script/release.sh

      - name: Collect the release files
        id: collect
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          DMG="dist/release/Notchy-$VERSION.dmg"
          OUT="$RUNNER_TEMP/notchy-installer"
          mkdir -p "$OUT"
          cp "$DMG" "$OUT/Notchy.dmg"
          cp "$RUNNER_TEMP/auraface-conversion.json" "$RUNNER_TEMP/auraface-parity.json" "$OUT/"
          (cd "$OUT" && shasum -a 256 Notchy.dmg > SHA256SUMS.txt)
          printf '{"name":"Notchy","version":"%s","build":"%s","sourceCommit":"%s","architectures":["arm64","x86_64"],"minimumMacOS":"14.0","notarized":false}\n' \
            "$VERSION" "$(git rev-list --count HEAD)" "$(git rev-parse HEAD)" > "$OUT/build-metadata.json"
          cat "$OUT/build-metadata.json"
          cat "$OUT/SHA256SUMS.txt"

      - name: Verify the installer
        run: |
          set -euxo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          APP="dist/release/Notchy.app"
          DMG="dist/release/Notchy-$VERSION.dmg"
          lipo "$APP/Contents/MacOS/Notchy" -verify_arch arm64 x86_64
          lipo -archs "$APP/Contents/MacOS/Notchy"
          codesign --verify --deep --strict "$APP"
          hdiutil verify "$DMG"
          test -s "$APP/Contents/Resources/AppIcon.icns"
          for model in FaceDescriptor AuraFace MiniFASNetV2 MiniFASNetV1SE; do
            test -d "$APP/Contents/Resources/$model.mlmodelc"
          done
          for notice in AuraFace-LICENSE.md AuraFace-APACHE-2.0.txt MiniFASNet-LICENSE.txt MiniFASNet-NOTICE.md; do
            test -s "$APP/Contents/Resources/$notice"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NotchyExperimentalFaceUnlock' "$APP/Contents/Info.plist")" = 'false'
          test -s "$APP/Contents/Resources/FaceDescriptor-LICENSE.md"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")" = '14.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'com.local.Notchy'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NotchyUpdateRepository' "$APP/Contents/Info.plist")" = "$UPDATE_REPOSITORY"
          git diff --exit-code

      - name: Upload the installer for verification or publication
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notchy-universal-installer
          path: ${{ runner.temp }}/notchy-installer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
